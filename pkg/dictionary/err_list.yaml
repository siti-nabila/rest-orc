    en: session request must contain exactly one credential
    id: request sesi harus berisi tepat satu credential
  session_result_invalid:
    code: SES003
    en: session dependency returned an invalid result
    id: dependency sesi mengembalikan hasil tidak valid
  browser_policy_required:
    code: SES004
    en: browser policy must not be nil
    id: policy browser tidak boleh nil
  csrf_generation_failed:
    code: SES005
    en: could not prepare browser proof
    id: tidak dapat menyiapkan bukti browser
  grpc_password_service_required:
