errors:
  invalid_browser_origins:
    code: CFG010
    en: must contain exact HTTPS origins without paths or wildcards
    id: harus berisi origin HTTPS persis tanpa path atau wildcard
    zh: 必须包含无路径或通配符的精确 HTTPS 来源
  invalid_csrf_secret:
    code: CFG011
    en: must be a separate canonical unpadded base64url secret of 32 bytes
    id: harus berupa secret base64url kanonis terpisah tanpa padding sepanjang 32 byte
    zh: 必须是独立的32字节无填充规范base64url密钥
